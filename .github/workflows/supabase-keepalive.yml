name: Supabase Keep-Alive

# Verhindert, dass das kostenlose Supabase-Projekt wegen Inaktivität pausiert wird
# (Free-Tier-Projekte pausieren nach ca. 7 Tagen ohne API-Zugriff).
# Läuft alle 3 Tage und schickt eine winzige Anfrage an die Supabase-API.

on:
  schedule:
    - cron: "0 6 */3 * *"   # alle 3 Tage, 06:00 UTC
  workflow_dispatch:         # manuell auslösbar über den "Run workflow"-Button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP-Status: %{http_code}\n"
